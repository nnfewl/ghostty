name: Release Twemoji builds

on:
  schedule:
    - cron: '37 11 * * *'   # nightly at 11:37 UTC (3:37 AM PST)
  workflow_dispatch: {}

permissions:
  contents: write   # gh release create/delete + tag push
  issues: write     # rebase failure notifications

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ghostty-org/ghostty
  # Opt into Node.js 24 for actions still declaring node20 (e.g.
  # magic-nix-cache-action@v13). Node 20 is removed from runners
  # on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -----------------------------------------------------------------------
  # detect-upstream
  # -----------------------------------------------------------------------
  detect-upstream:
    runs-on: ubuntu-24.04
    outputs:
      main_sha:        ${{ steps.detect.outputs.main_sha }}
      main_full_sha:   ${{ steps.detect.outputs.main_full_sha }}
      stable_branch:   ${{ steps.detect.outputs.stable_branch }}
      stable_sha:      ${{ steps.detect.outputs.stable_sha }}
      stable_full_sha: ${{ steps.detect.outputs.stable_full_sha }}
      stable_version:  ${{ steps.detect.outputs.stable_version }}
      build_main:      ${{ steps.detect.outputs.build_main }}
      build_stable:    ${{ steps.detect.outputs.build_stable }}
      today:           ${{ steps.detect.outputs.today }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect upstream + existing releases
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/detect-upstream.sh
      - name: Summary
        run: |
          echo "### Upstream state" >> "$GITHUB_STEP_SUMMARY"
          echo "| | sha | needs build? |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| main | \`${{ steps.detect.outputs.main_sha }}\` | ${{ steps.detect.outputs.build_main }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| stable (\`${{ steps.detect.outputs.stable_branch }}\` @ v${{ steps.detect.outputs.stable_version }}) | \`${{ steps.detect.outputs.stable_sha }}\` | ${{ steps.detect.outputs.build_stable }} |" >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # sync-fork: fast-forward our fork's mirror branches (main + current
  # stable X.Y.x) to match upstream HEAD. Pure mirror — we never commit
  # to these branches, so there's never a conflict.
  # -----------------------------------------------------------------------
  sync-fork:
    needs: detect-upstream
    if: needs.detect-upstream.outputs.build_main == 'true' || needs.detect-upstream.outputs.build_stable == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Fast-forward mirror branches + stable tag
        env:
          STABLE_BRANCH: ${{ needs.detect-upstream.outputs.stable_branch }}
          STABLE_TAG: v${{ needs.detect-upstream.outputs.stable_version }}
        run: |
          git config user.email "twemoji-pipeline@local"
          git config user.name  "twemoji-pipeline"
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch --no-tags upstream main "$STABLE_BRANCH" "refs/tags/${STABLE_TAG}:refs/tags/${STABLE_TAG}"
          # Force-push fast-forwards (no conflict possible since these
          # branches are pure mirrors; --force-with-lease would refuse
          # if anyone manually modified them).
          git push origin \
            "refs/remotes/upstream/main:refs/heads/main" \
            "refs/remotes/upstream/${STABLE_BRANCH}:refs/heads/${STABLE_BRANCH}" \
            "refs/tags/${STABLE_TAG}:refs/tags/${STABLE_TAG}" \
            --force

  # -----------------------------------------------------------------------
  # rebase-dev-branches: rebase the 4 dev branches onto their channel
  # targets (stable tag or upstream main) and force-push. Build jobs
  # depend on this and check per-branch success flags.
  # -----------------------------------------------------------------------
  rebase-dev-branches:
    needs: [detect-upstream, sync-fork]
    if: needs.detect-upstream.outputs.build_main == 'true' || needs.detect-upstream.outputs.build_stable == 'true'
    runs-on: ubuntu-24.04
    outputs:
      emoji_stable_ok: ${{ steps.rebase.outputs.emoji_stable_ok }}
      emoji_main_ok:   ${{ steps.rebase.outputs.emoji_main_ok }}
      sbix_stable_ok:  ${{ steps.rebase.outputs.sbix_stable_ok }}
      sbix_main_ok:    ${{ steps.rebase.outputs.sbix_main_ok }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Need PAT: rebased dev branches include upstream's workflow
          # files, which GITHUB_TOKEN cannot push (no workflows: write).
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Rebase dev branches
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_VERSION: ${{ needs.detect-upstream.outputs.stable_version }}
        run: bash scripts/rebase-dev-branches.sh "$STABLE_VERSION"

  # -----------------------------------------------------------------------
  # Reusable composite logic via job templates would be nicer here, but
  # GitHub Actions doesn't support `uses:` for embedded jobs without
  # creating separate workflow files. We accept the repetition.
  #
  # Each build job:
  #   1. Checks out our fork (full clone, so it has twemoji-* branches).
  #   2. Adds upstream as remote, fetches the channel's full SHA.
  #   3. Creates a worktree (or sparse checkout) of upstream at that SHA.
  #   4. Generates patches from the relevant dev branch and applies them.
  #   5. Builds with Nix/Zig (Linux) or Nix/Zig + Xcode (macOS).
  #   6. Uploads the artifact.
  # -----------------------------------------------------------------------

  # ===== Linux (CBDT Twemoji) =============================================
  build-linux-main:
    needs: [detect-upstream, rebase-dev-branches]
    if: needs.detect-upstream.outputs.build_main == 'true' && needs.rebase-dev-branches.outputs.emoji_main_ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout our fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build workspace at upstream main + patches
        env:
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.main_full_sha }}
        run: |
          # Create a worktree of upstream at the target SHA
          git worktree add ../upstream "$UPSTREAM_SHA"
          # Generate our patches against upstream main (where dev branch was based)
          mkdir -p /tmp/patches
          bash scripts/generate-patches.sh twemoji-emoji-main origin/main /tmp/patches
          # Apply patches inside the worktree
          cd ../upstream
          git config user.email "twemoji-pipeline@local"
          git config user.name  "twemoji-pipeline"
          git am --3way /tmp/patches/*.patch
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: false }
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with: { use-flakehub: disabled, use-gha-cache: enabled }
      - name: Build Ghostty (Linux)
        working-directory: ../upstream
        run: nix develop -c zig build -Doptimize=ReleaseFast -p ./out
      - name: Package artifact
        working-directory: ../upstream
        run: |
          mkdir -p ${{ github.workspace }}/staging
          cp out/bin/ghostty ${{ github.workspace }}/staging/
          cd ${{ github.workspace }}/staging
          tar czf ghostty-linux-x86_64.tar.gz ghostty
      - uses: actions/upload-artifact@v7
        with:
          name: linux-main
          path: staging/ghostty-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-linux-stable:
    needs: [detect-upstream, rebase-dev-branches]
    if: needs.detect-upstream.outputs.build_stable == 'true' && needs.rebase-dev-branches.outputs.emoji_stable_ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Build workspace at upstream stable + patches
        env:
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.stable_full_sha }}
        run: |
          git worktree add ../upstream "$UPSTREAM_SHA"
          mkdir -p /tmp/patches
          bash scripts/generate-patches.sh twemoji-emoji-stable "v${{ needs.detect-upstream.outputs.stable_version }}" /tmp/patches
          cd ../upstream
          git config user.email "twemoji-pipeline@local"
          git config user.name  "twemoji-pipeline"
          git am --3way /tmp/patches/*.patch
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: false }
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with: { use-flakehub: disabled, use-gha-cache: enabled }
      - name: Build Ghostty (Linux)
        working-directory: ../upstream
        run: nix develop -c zig build -Doptimize=ReleaseFast -p ./out
      - name: Package artifact
        working-directory: ../upstream
        run: |
          mkdir -p ${{ github.workspace }}/staging
          cp out/bin/ghostty ${{ github.workspace }}/staging/
          cd ${{ github.workspace }}/staging
          tar czf ghostty-linux-x86_64.tar.gz ghostty
      - uses: actions/upload-artifact@v7
        with:
          name: linux-stable
          path: staging/ghostty-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ===== macOS COLR (Twemoji Mozilla) =====================================
  build-macos-colr-main:
    needs: [detect-upstream, rebase-dev-branches]
    if: needs.detect-upstream.outputs.build_main == 'true' && needs.rebase-dev-branches.outputs.emoji_main_ok == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Build workspace at upstream main + patches
        env:
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.main_full_sha }}
        run: |
          git worktree add ../upstream "$UPSTREAM_SHA"
          mkdir -p /tmp/patches
          bash scripts/generate-patches.sh twemoji-emoji-main origin/main /tmp/patches
          cd ../upstream
          git config user.email "twemoji-pipeline@local"
          git config user.name  "twemoji-pipeline"
          git am --3way /tmp/patches/*.patch
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: false }
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with: { use-flakehub: disabled, use-gha-cache: enabled }
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build GhosttyKit (Zig static lib)
        working-directory: ../upstream
        run: nix develop -c zig build -Doptimize=ReleaseFast -Demit-macos-app=false
      - name: Build Ghostty.app
        working-directory: ../upstream/macos
        run: xcodebuild -target Ghostty -configuration ReleaseLocal
      - name: Zip Ghostty.app
        working-directory: ../upstream/macos/build/ReleaseLocal
        run: |
          mkdir -p ${{ github.workspace }}/staging
          zip -r ${{ github.workspace }}/staging/ghostty-macos-arm64-colr.zip Ghostty.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-colr-main
          path: staging/ghostty-macos-arm64-colr.zip
          if-no-files-found: error
          retention-days: 1

  build-macos-colr-stable:
    needs: [detect-upstream, rebase-dev-branches]
    if: needs.detect-upstream.outputs.build_stable == 'true' && needs.rebase-dev-branches.outputs.emoji_stable_ok == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Build workspace at upstream stable + patches
        env:
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.stable_full_sha }}
        run: |
          git worktree add ../upstream "$UPSTREAM_SHA"
          mkdir -p /tmp/patches
          bash scripts/generate-patches.sh twemoji-emoji-stable "v${{ needs.detect-upstream.outputs.stable_version }}" /tmp/patches
          cd ../upstream
          git config user.email "twemoji-pipeline@local"
          git config user.name  "twemoji-pipeline"
          git am --3way /tmp/patches/*.patch
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: false }
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with: { use-flakehub: disabled, use-gha-cache: enabled }
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build GhosttyKit (Zig static lib)
        working-directory: ../upstream
        run: nix develop -c zig build -Doptimize=ReleaseFast -Demit-macos-app=false
      - name: Build Ghostty.app
        working-directory: ../upstream/macos
        run: xcodebuild -target Ghostty -configuration ReleaseLocal
      - name: Zip Ghostty.app
        working-directory: ../upstream/macos/build/ReleaseLocal
        run: |
          mkdir -p ${{ github.workspace }}/staging
          zip -r ${{ github.workspace }}/staging/ghostty-macos-arm64-colr.zip Ghostty.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-colr-stable
          path: staging/ghostty-macos-arm64-colr.zip
          if-no-files-found: error
          retention-days: 1

  # ===== macOS sbix (Twemoji-repacked Apple Color Emoji) ==================
  build-macos-sbix-main:
    needs: [detect-upstream, rebase-dev-branches]
    if: needs.detect-upstream.outputs.build_main == 'true' && needs.rebase-dev-branches.outputs.sbix_main_ok == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Build workspace at upstream main + patches
        env:
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.main_full_sha }}
        run: |
          git worktree add ../upstream "$UPSTREAM_SHA"
          mkdir -p /tmp/patches
          bash scripts/generate-patches.sh twemoji-sbix-main origin/main /tmp/patches
          cd ../upstream
          git config user.email "twemoji-pipeline@local"
          git config user.name  "twemoji-pipeline"
          git am --3way /tmp/patches/*.patch
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: false }
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with: { use-flakehub: disabled, use-gha-cache: enabled }
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build GhosttyKit (Zig static lib)
        working-directory: ../upstream
        run: nix develop -c zig build -Doptimize=ReleaseFast -Demit-macos-app=false
      - name: Build Ghostty.app
        working-directory: ../upstream/macos
        run: xcodebuild -target Ghostty -configuration ReleaseLocal
      - name: Zip Ghostty.app
        working-directory: ../upstream/macos/build/ReleaseLocal
        run: |
          mkdir -p ${{ github.workspace }}/staging
          zip -r ${{ github.workspace }}/staging/ghostty-macos-arm64-sbix.zip Ghostty.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-sbix-main
          path: staging/ghostty-macos-arm64-sbix.zip
          if-no-files-found: error
          retention-days: 1

  build-macos-sbix-stable:
    needs: [detect-upstream, rebase-dev-branches]
    if: needs.detect-upstream.outputs.build_stable == 'true' && needs.rebase-dev-branches.outputs.sbix_stable_ok == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Build workspace at upstream stable + patches
        env:
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.stable_full_sha }}
        run: |
          git worktree add ../upstream "$UPSTREAM_SHA"
          mkdir -p /tmp/patches
          bash scripts/generate-patches.sh twemoji-sbix-stable "v${{ needs.detect-upstream.outputs.stable_version }}" /tmp/patches
          cd ../upstream
          git config user.email "twemoji-pipeline@local"
          git config user.name  "twemoji-pipeline"
          git am --3way /tmp/patches/*.patch
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: false }
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with: { use-flakehub: disabled, use-gha-cache: enabled }
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build GhosttyKit (Zig static lib)
        working-directory: ../upstream
        run: nix develop -c zig build -Doptimize=ReleaseFast -Demit-macos-app=false
      - name: Build Ghostty.app
        working-directory: ../upstream/macos
        run: xcodebuild -target Ghostty -configuration ReleaseLocal
      - name: Zip Ghostty.app
        working-directory: ../upstream/macos/build/ReleaseLocal
        run: |
          mkdir -p ${{ github.workspace }}/staging
          zip -r ${{ github.workspace }}/staging/ghostty-macos-arm64-sbix.zip Ghostty.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-sbix-stable
          path: staging/ghostty-macos-arm64-sbix.zip
          if-no-files-found: error
          retention-days: 1

  # -----------------------------------------------------------------------
  # release-main: bundles the 3 main artifacts into one GitHub Release
  # -----------------------------------------------------------------------
  release-main:
    needs:
      - detect-upstream
      - build-linux-main
      - build-macos-colr-main
      - build-macos-sbix-main
    if: needs.detect-upstream.outputs.build_main == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Compose release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: main-${{ needs.detect-upstream.outputs.today }}-${{ needs.detect-upstream.outputs.main_sha }}
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.main_full_sha }}
        run: |
          mkdir -p assets
          mv dist/linux-main/ghostty-linux-x86_64.tar.gz       assets/
          mv dist/macos-colr-main/ghostty-macos-arm64-colr.zip assets/
          mv dist/macos-sbix-main/ghostty-macos-arm64-sbix.zip assets/

          cat > body.md <<EOF
          # Twemoji build of Ghostty (main)

          Built from upstream \`main\` at [${UPSTREAM_SHA}](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${UPSTREAM_SHA}).

          ## Artifacts
          | Platform | Variant | File |
          |---|---|---|
          | Linux x86_64 | Twemoji CBDT | \`ghostty-linux-x86_64.tar.gz\` |
          | macOS arm64 | Twemoji Mozilla (COLRv0) | \`ghostty-macos-arm64-colr.zip\` |
          | macOS arm64 | Twemoji-as-sbix | \`ghostty-macos-arm64-sbix.zip\` |

          > Pre-release: tracks upstream development; expect occasional breakage.
          EOF

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file body.md \
            --prerelease \
            --target twemoji-pipeline \
            assets/*

  # -----------------------------------------------------------------------
  # release-stable: bundles the 3 stable artifacts into one GitHub Release
  # -----------------------------------------------------------------------
  release-stable:
    needs:
      - detect-upstream
      - build-linux-stable
      - build-macos-colr-stable
      - build-macos-sbix-stable
    if: needs.detect-upstream.outputs.build_stable == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Compose release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: stable-${{ needs.detect-upstream.outputs.stable_version }}-${{ needs.detect-upstream.outputs.today }}-${{ needs.detect-upstream.outputs.stable_sha }}
          UPSTREAM_BRANCH: ${{ needs.detect-upstream.outputs.stable_branch }}
          UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.stable_full_sha }}
          VERSION: ${{ needs.detect-upstream.outputs.stable_version }}
        run: |
          mkdir -p assets
          mv dist/linux-stable/ghostty-linux-x86_64.tar.gz       assets/
          mv dist/macos-colr-stable/ghostty-macos-arm64-colr.zip assets/
          mv dist/macos-sbix-stable/ghostty-macos-arm64-sbix.zip assets/

          cat > body.md <<EOF
          # Twemoji build of Ghostty (stable v${VERSION})

          Built from upstream \`${UPSTREAM_BRANCH}\` at [${UPSTREAM_SHA}](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${UPSTREAM_SHA}).

          ## Artifacts
          | Platform | Variant | File |
          |---|---|---|
          | Linux x86_64 | Twemoji CBDT | \`ghostty-linux-x86_64.tar.gz\` |
          | macOS arm64 | Twemoji Mozilla (COLRv0) | \`ghostty-macos-arm64-colr.zip\` |
          | macOS arm64 | Twemoji-as-sbix | \`ghostty-macos-arm64-sbix.zip\` |
          EOF

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file body.md \
            --target twemoji-pipeline \
            assets/*

  # -----------------------------------------------------------------------
  # cleanup: keep 5 most recent releases per channel
  # -----------------------------------------------------------------------
  cleanup:
    needs:
      - release-main
      - release-stable
    if: always() && (needs.release-main.result == 'success' || needs.release-stable.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-releases.sh 5
