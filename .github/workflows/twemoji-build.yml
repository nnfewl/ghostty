name: Build Twemoji

on:
  push:
    branches: [twemoji-emoji, twemoji-sbix]
  workflow_dispatch:

concurrency:
  group: build-twemoji-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Build Ghostty
        run: nix develop -c zig build -Doptimize=ReleaseFast -p ./out

      - name: Verify binary
        run: |
          file ./out/bin/ghostty
          ls -la ./out/bin/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-linux-x86_64-twemoji
          path: out/bin/ghostty
          if-no-files-found: error

  build-macos:
    name: macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Xcode Version
        run: xcodebuild -version

      # Step 1: Build the Zig static library inside the Nix environment.
      # This must NOT include the macOS .app build (Nix breaks xcodebuild).
      - name: Build GhosttyKit (Zig static lib)
        run: nix develop -c zig build -Doptimize=ReleaseFast -Demit-macos-app=false

      # Step 2: Build the .app with Xcode, outside the Nix environment.
      # ReleaseLocal uses the project's ad-hoc signing configuration.
      # To run it locally after download: xattr -dr com.apple.quarantine Ghostty.app
      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration ReleaseLocal

      - name: Zip Ghostty.app
        run: |
          cd macos/build/ReleaseLocal
          zip -r ../../../ghostty-macos-arm64-twemoji.zip Ghostty.app

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-macos-arm64-twemoji
          path: ghostty-macos-arm64-twemoji.zip
          if-no-files-found: error
